services:
  - type: web
    name: frame-watch-party
    runtime: node
    buildCommand: npm install --include=dev && npm --workspace shared run build && npm --workspace server run build
    startCommand: npm --workspace server run start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_PATH
        value: ./data/watch-party.sqlite
      - key: CLIENT_ORIGIN
        sync: false
  - type: web
    name: frame-watch-party-client
    runtime: static
    buildCommand: npm install --include=dev && npm --workspace shared run build && npm --workspace client run build
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_SERVER_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
